name: Deploy to Staging (SSH rsync)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Deploy to Hostinger Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ========================================================================
      # CRITICAL DEPLOYMENT INTEGRITY RULES:
      # 1. NEVER USE '--delete':
      #    - uploads/ contains client-uploaded media, WebP variants, and covers.
      #    - app/storage/ contains server runtime state (installed.lock, logs,
      #      HTMLPurifier cache in cache/htmlpurifier/).
      #    Wiping or deleting either directory would permanently destroy all
      #    production media, audit logs, and security locks.
      #
      # 2. LOCAL PUBLIC_HTML DIRECTORY DEPLOYMENT:
      #    - Uploads the contents of public_html/ (which now houses app/, vendor/,
      #      database/migrations/, database/install.sql, assets/, and front controller).
      #    - Excludes client uploads/ except security barrier files (.htaccess & index.html).
      #    - Excludes app/config/config.local.php (server-specific environment secrets).
      #    - Excludes app/storage/ runtime files (except .gitkeep).
      #    - Excludes database/seed* development seeders.
      #
      # 3. DIRECTORIES NEVER DEPLOYED:
      #    - tailwind/         (source CSS and CLI binary; compiled app.css is in public_html/assets/css)
      #    - tests/            (automated test suites)
      #    - bin/              (local CLI scripts: serve.sh, migrate.php, build-install-sql.php)
      #    - .github/          (CI/CD workflow definitions)
      #    - *.md              (documentation and blueprints)
      #    - .git*             (git version control metadata)
      # ========================================================================

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Sync public_html via rsync over SSH
        run: |
          rsync -avz --itemize-changes \
            -e "ssh -p ${{ secrets.STAGING_SSH_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            --include='*/' \
            --include='uploads/.htaccess' \
            --include='uploads/index.html' \
            --exclude='uploads/**' \
            --exclude='app/config/config.local.php' \
            --include='**/.gitkeep' \
            --exclude='app/storage/**' \
            --exclude='database/seed*' \
            --exclude='.DS_Store' \
            public_html/ "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_PATH }}/" > rsync_output.txt

          echo "=== List of Transferred Files ==="
          cat rsync_output.txt

